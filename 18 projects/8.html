<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var x = 20;
        var y = 30;
        console.log("x =" + (x) + " and y =" + (y) + " into  x == y: " + (x == y));
        console.log("x =" + (x) + " and y =" + (y) + " into  x!= y: " + (x != y));
        console.log("x =" + (x) + " and y =" + (y) + " into  x > y: " + (x > y));
        console.log("x =" + (x) + " and y =" + (y) + " into  x < y: " + (x < y));
        console.log("x =" + (x) + " and y =" + (y) + " into  x >= y: " + (x >= y));
        console.log("x =" + (x) + " and y =" + (y) + " into  x <= y: " + (x <= y));
    </script>
</body>

</html>
