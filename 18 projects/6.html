<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var mark = 50 ;
        console.log("Marks: " + mark);
        mark += 10;
        console.log("Marks after += " + mark);
        mark -= 10;
        console.log("Marks after -= " + mark);
        mark *= 2;
        console.log("Marks after *= " + mark);
        mark /= 2;
        console.log("Marks after /= " + mark);
    </script>
</body>
</html>
