<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
       *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
       }
       div{
        height: 100vh;
        padding: 20px;
       }

       section{
        width: 100%;
        height: 100%;
        background-color: rgb(3, 3, 3);
        display: flex;
        justify-content: space-between;
        background-size: 100% 100%;
        background-repeat: no-repeat;
       }
       button{
        background-color: transparent;
        font-size: 50px;
        border: 0px;
        padding: 20px;
        color: aliceblue;
        &:hover{
            color: red;
        }
       }
    </style>
</head>
<body>
    <div>
        <section id="back">
            <button id="b1">&langle;</button>
            <button id="b2">&rangle;</button>
        </section>
    </div>
    <script src="img.js"></script>
</body>
</html>
