<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        alert(`welcome to guess the num game`);
        var istrue = true;
        while (istrue) {
            var num1 = parseInt(Math.random() * 100);
            var count = 10;
            while (true) {
                if (count == 0) {
                    alert("game over !!");
                    break;

                }
                var n = Number(prompt("enter your number :"));
                count--;
                if (n < num1) {
                    alert(`number is higher`);
                }
                else if (num1 == n) {
                    alert(`correct`);
                }
                else {
                    alert(`number is lower`);
                }

            }
            istrue = confirm("play again");
        }
    </script>
</body>

</html>
